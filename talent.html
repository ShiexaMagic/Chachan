<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მსახიობი - shuQi Production</title>
    <meta name="description" content="მსახიობის პორტფოლიო — ფოტოები, შოურილი და CV. Actor profile at shuQi Production.">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="shuQi Production - Actor Portfolio">
    <meta property="og:description" content="Actor Profile - shuQi Production">
    <meta property="og:type" content="profile">
    <meta property="og:image" content="https://www.shuqi.ge/images/web.png">
    <meta property="og:locale" content="ka_GE">
    
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script defer src="https://va.vercel-scripts.com/v1/script.js"></script>
    
    <style>
        :root {
            --pure-black: #000000;
            --dark-gray: #1d1d1f;
            --medium-gray: #86868b;
            --light-gray: #d2d2d7;
            --off-white: #f5f5f7;
            --pure-white: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans Georgian', 'Segoe UI', 'Roboto', sans-serif;
            background: #fff;
            color: var(--dark-gray);
            line-height: 1.6;
        }
        
        /* Header */
        .talent-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-logo {
            height: 40px;
        }
        
        .header-logo img {
            height: 100%;
            filter: brightness(0);
        }
        
        .header-nav {
            display: flex;
            gap: 2rem;
        }
        
        .header-nav a {
            color: var(--dark-gray);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .header-nav a:hover {
            color: var(--pure-black);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--medium-gray);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.3s;
        }
        
        .back-btn:hover {
            color: var(--dark-gray);
        }
        
        /* Hero Section */
        .talent-hero {
            background: linear-gradient(135deg, #1d1d1f 0%, #000 100%);
            color: white;
            padding: 60px 20px;
        }
        
        .talent-hero-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 3rem;
            align-items: start;
        }
        
        .talent-hero-photo {
            position: relative;
        }
        
        .talent-main-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.1);
        }
        
        .talent-photo-gallery {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        
        .talent-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        .talent-thumb:hover,
        .talent-thumb.active {
            border-color: white;
        }
        
        .talent-hero-info {
            padding-top: 1rem;
        }
        
        .talent-name {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .talent-role {
            font-size: 1.25rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }
        
        .talent-quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .quick-stat {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-left: 3px solid rgba(255,255,255,0.3);
        }
        
        .quick-stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .quick-stat-value {
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .talent-contact-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .contact-btn {
            padding: 12px 28px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .contact-btn-primary {
            background: white;
            color: var(--dark-gray);
        }
        
        .contact-btn-primary:hover {
            background: var(--off-white);
        }
        
        .contact-btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .contact-btn-secondary:hover {
            border-color: white;
        }
        
        /* Navigation Tabs */
        .talent-nav {
            background: var(--off-white);
            border-bottom: 1px solid var(--light-gray);
            position: sticky;
            top: 60px;
            z-index: 999;
        }
        
        .talent-nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }
        
        .talent-nav-link {
            padding: 1rem 1.5rem;
            color: var(--medium-gray);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .talent-nav-link:hover,
        .talent-nav-link.active {
            color: var(--dark-gray);
            border-bottom-color: var(--dark-gray);
        }
        
        /* Main Content */
        .talent-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .talent-section {
            margin-bottom: 60px;
            scroll-margin-top: 140px;
        }
        
        .section-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--light-gray);
        }
        
        /* Personal Details & Appearance */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
            gap: 2rem;
        }
        
        .details-card {
            background: var(--off-white);
            padding: 1.5rem;
        }
        
        .details-card h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--dark-gray);
        }
        
        .details-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .detail-label {
            color: var(--medium-gray);
            font-size: 0.875rem;
        }
        
        .detail-value {
            font-weight: 500;
            text-align: right;
        }
        
        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        
        .skill-category {
            background: var(--off-white);
            padding: 1.5rem;
        }
        
        .skill-category h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .skill-category h4::before {
            content: '';
            width: 4px;
            height: 1rem;
            background: var(--dark-gray);
        }
        
        .skill-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }
        
        .skill-name {
            color: var(--dark-gray);
        }
        
        .skill-level {
            color: var(--medium-gray);
            font-size: 0.75rem;
        }
        
        .skill-level.high {
            color: #34c759;
        }
        
        .skill-level.medium {
            color: #ff9500;
        }
        
        /* Videos/Showreels */
        .videos-grid {
            display: grid;
            max-width: 1000px;
            grid-template-columns: repeat(auto-fit, minmax(min(350px, 100%), 1fr));
            gap: 1.5rem;
        }
        
        .video-card {
            background: var(--off-white);
            overflow: hidden;
        }
        
        .video-embed {
            aspect-ratio: 16/9;
            background: #000;
        }
        
        .video-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-info {
            padding: 1rem;
        }
        
        .video-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .video-meta {
            font-size: 0.75rem;
            color: var(--medium-gray);
        }
        
        /* CV Section */
        .cv-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--light-gray);
            overflow-x: auto;
        }
        
        .cv-tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: var(--medium-gray);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .cv-tab:hover,
        .cv-tab.active {
            color: var(--dark-gray);
            border-bottom-color: var(--dark-gray);
        }
        
        .cv-content {
            display: none;
        }
        
        .cv-content.active {
            display: block;
        }
        
        .cv-entry {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 1.5rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--light-gray);
        }
        
        .cv-year {
            font-weight: 600;
            color: var(--medium-gray);
        }
        
        .cv-details h5 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .cv-details p {
            color: var(--medium-gray);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }
        
        .cv-role {
            display: inline-block;
            background: var(--dark-gray);
            color: white;
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
        
        /* Photo Gallery Section */
        .photos-section {
            margin-bottom: 60px;
        }
        
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .photo-item {
            aspect-ratio: 3/4;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .photo-item:hover img {
            transform: scale(1.05);
        }
        
        /* Contact Section */
        .contact-section {
            background: var(--off-white);
            padding: 2rem;
        }
        
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        
        .contact-method {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .contact-icon {
            width: 48px;
            height: 48px;
            background: var(--dark-gray);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        
        .contact-info h5 {
            font-size: 0.75rem;
            color: var(--medium-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .contact-info a {
            color: var(--dark-gray);
            text-decoration: none;
            font-weight: 500;
        }
        
        .contact-info a:hover {
            text-decoration: underline;
        }
        
        /* Footer */
        .talent-footer {
            background: var(--dark-gray);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .talent-footer p {
            color: rgba(255,255,255,0.6);
            font-size: 0.875rem;
        }
        
        .talent-footer a {
            color: white;
            text-decoration: none;
        }
        
        /* Lightbox */
        .photo-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .photo-lightbox.active {
            display: flex;
        }
        
        .lightbox-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 1rem;
            cursor: pointer;
        }
        
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        
        /* Not Found */
        .not-found {
            text-align: center;
            padding: 100px 20px;
        }
        
        .not-found h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .not-found p {
            color: var(--medium-gray);
            margin-bottom: 2rem;
        }
        
        .not-found a {
            color: var(--dark-gray);
        }
        
        /* Header actions & language switch */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .lang-switch {
            background: var(--dark-gray);
            color: var(--pure-white);
            border: none;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            border-radius: 50px;
        }
        
        .lang-switch:hover {
            background: var(--pure-black);
        }
        
        /* Thumbnails & photo buttons */
        .talent-thumb-btn,
        .photo-item {
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: block;
            flex-shrink: 0;
        }
        
        .talent-thumb-btn:focus-visible,
        .photo-item:focus-visible,
        .contact-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }
        
        .photo-item:focus-visible {
            outline-color: var(--dark-gray);
        }
        
        /* Overview */
        .overview-block {
            margin-top: 2rem;
        }
        
        .overview-block h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        
        .bio-text {
            color: #424245;
            line-height: 1.8;
            white-space: pre-line;
            max-width: 75ch;
        }
        
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .skill-tag {
            background: var(--off-white);
            border: 1px solid var(--light-gray);
            padding: 6px 14px;
            font-size: 0.875rem;
            border-radius: 50px;
        }
        
        .video-embed video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        
        /* CV */
        .cv-text {
            background: var(--off-white);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        
        .cv-text p {
            white-space: pre-line;
            line-height: 1.8;
        }
        
        .cv-download {
            display: inline-block;
            padding: 12px 28px;
            background: var(--dark-gray);
            color: #fff;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .cv-download:hover {
            background: var(--pure-black);
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .talent-hero-content {
                grid-template-columns: 1fr;
            }
            
            .talent-hero-photo {
                max-width: 400px;
                margin: 0 auto;
            }
            
            .talent-name {
                font-size: 2.5rem;
            }
            
            .cv-entry {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
        }
        
        @media (max-width: 600px) {
            .header-nav {
                display: none;
            }
            
            .talent-hero {
                padding: 32px 16px;
            }
            
            .talent-name {
                font-size: 2rem;
            }
            
            .talent-main {
                padding: 32px 16px;
            }
            
            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .talent-quick-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .videos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="talent-header">
        <div class="header-container">
            <a href="index.html" class="header-logo">
                <img src="./images/shuqi-logo.png" alt="shuQi Production">
            </a>
            <nav class="header-nav">
                <a href="index.html" data-i18n="home">მთავარი</a>
                <a href="portfolio.html" data-i18n="portfolio">პორტფოლიო</a>
                <a href="index.html#contact" data-i18n="contact">კონტაქტი</a>
            </nav>
            <div class="header-actions">
                <a href="portfolio.html" class="back-btn">← <span data-i18n="back">პორტფოლიო</span></a>
                <button class="lang-switch" id="langSwitch" type="button">EN</button>
            </div>
        </div>
    </header>

    <!-- Main Content - Loaded Dynamically -->
    <div id="talentPageContent">
        <div class="not-found">
            <h1 data-i18n="loading">იტვირთება...</h1>
        </div>
    </div>

    <!-- Footer -->
    <footer class="talent-footer">
        <p>© <span id="footerYear">2026</span> <a href="index.html">shuQi Production</a>. <span data-i18n="rights">ყველა უფლება დაცულია.</span></p>
    </footer>

    <!-- Photo Lightbox -->
    <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous">&#10094;</button>
        <img src="" alt="" class="lightbox-image" id="lightboxImage">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next">&#10095;</button>
    </div>

    <script src="talents/talents.js"></script>
    <script>
        const T = window.ShuqiTalents;
        const esc = T.escapeHtml;
        let currentLang = T.getLang();
        let currentTalent = null;
        let notFound = false;
        let currentPhotos = [];
        let currentLightboxIndex = 0;

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        function getTalentSlug() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) return id;
            const match = window.location.pathname.match(/\/talent\/([^\/]+)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        // ========================================
        // LANGUAGE
        // ========================================
        function updateLanguage(lang) {
            currentLang = lang;
            T.setLang(lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = T.str(el.dataset.i18n, lang);
            });
            const langSwitch = document.getElementById('langSwitch');
            langSwitch.textContent = lang === 'ka' ? 'EN' : 'ქარ';
            langSwitch.title = lang === 'ka' ? 'Switch to English' : 'ქართულზე გადართვა';
            document.getElementById('lightboxClose').setAttribute('aria-label', T.str('close', lang));
            document.getElementById('lightboxPrev').setAttribute('aria-label', T.str('prev', lang));
            document.getElementById('lightboxNext').setAttribute('aria-label', T.str('next', lang));

            if (currentTalent) renderTalentPage(currentTalent);
            else if (notFound) showNotFound();
        }

        document.getElementById('langSwitch').addEventListener('click', () => {
            updateLanguage(currentLang === 'ka' ? 'en' : 'ka');
        });

        // ========================================
        // RENDERING
        // ========================================
        function detailRow(labelKey, value) {
            if (value === '' || value == null) return '';
            return `
                <div class="detail-item">
                    <span class="detail-label">${esc(T.str(labelKey, currentLang))}</span>
                    <span class="detail-value">${esc(value)}</span>
                </div>`;
        }

        function quickStat(labelKey, value) {
            if (value === '' || value == null) return '';
            return `
                <div class="quick-stat">
                    <div class="quick-stat-label">${esc(T.str(labelKey, currentLang))}</div>
                    <div class="quick-stat-value">${esc(value)}</div>
                </div>`;
        }

        function renderTalentPage(talent) {
            const lang = currentLang;
            const s = key => esc(T.str(key, lang));
            const L = value => T.localized(value, lang);

            const name = L(talent.name);
            const photos = T.getPhotos(talent);
            const mainPhoto = photos[0] || T.placeholderPhoto;
            const videos = T.getVideos(talent);
            const skills = T.list(talent.skills, lang);
            const languages = T.list(talent.languages, lang);
            const age = T.getAge(talent);
            const ageText = age != null ? `${age} ${T.str('yearsOld', lang)}` : '';
            const genderText = talent.gender ? T.str(talent.gender === 'male' ? 'male' : 'female', lang) : '';
            const heightText = talent.height ? `${talent.height} ${T.str('cm', lang)}` : '';
            const weightText = talent.weight ? `${talent.weight} ${T.str('kg', lang)}` : '';
            const city = L(talent.city);
            const bio = L(talent.bio);
            const education = L(talent.education);
            const experience = L(talent.experience);
            const cvUrl = T.safeUrl(talent.cv);
            const role = L(talent.role) || T.str('actor', lang);
            const email = talent.email ? String(talent.email).trim() : '';
            const phone = talent.phone ? String(talent.phone).trim() : '';
            const hasCv = experience || cvUrl;

            document.title = name + ' - shuQi Production';
            currentPhotos = photos;

            document.getElementById('talentPageContent').innerHTML = `
                <section class="talent-hero">
                    <div class="talent-hero-content">
                        <div class="talent-hero-photo">
                            <img src="${esc(mainPhoto)}" alt="${esc(name)}" class="talent-main-image" id="heroMainPhoto" onerror="this.onerror=null;this.src='${T.placeholderPhoto}'">
                            ${photos.length > 1 ? `
                            <div class="talent-photo-gallery">
                                ${photos.map((photo, i) => `
                                    <button type="button" class="talent-thumb-btn" data-thumb="${i}" aria-label="${s('photos')} ${i + 1}">
                                        <img src="${esc(photo)}" alt="" class="talent-thumb ${i === 0 ? 'active' : ''}" loading="lazy">
                                    </button>
                                `).join('')}
                            </div>
                            ` : ''}
                        </div>
                        <div class="talent-hero-info">
                            <h1 class="talent-name">${esc(name)}</h1>
                            <p class="talent-role">${esc(role)}</p>

                            <div class="talent-quick-stats">
                                ${quickStat('age', ageText)}
                                ${quickStat('height', heightText)}
                                ${quickStat('city', city)}
                                ${quickStat('gender', genderText)}
                            </div>

                            <div class="talent-contact-buttons">
                                <a href="#contact" class="contact-btn contact-btn-primary">${s('contactBtn')}</a>
                                ${videos.length ? `<a href="#showreels" class="contact-btn contact-btn-secondary">▶ ${s('showreel')}</a>` : ''}
                                ${cvUrl ? `<a href="${esc(cvUrl)}" class="contact-btn contact-btn-secondary" target="_blank" rel="noopener">${s('downloadCv')}</a>` : ''}
                            </div>
                        </div>
                    </div>
                </section>

                <nav class="talent-nav">
                    <div class="talent-nav-container">
                        <a href="#overview" class="talent-nav-link active">${s('overview')}</a>
                        ${videos.length ? `<a href="#showreels" class="talent-nav-link">${s('showreel')}</a>` : ''}
                        ${photos.length > 1 ? `<a href="#photos" class="talent-nav-link">${s('photos')}</a>` : ''}
                        ${hasCv ? `<a href="#cv" class="talent-nav-link">${s('cv')}</a>` : ''}
                        <a href="#contact" class="talent-nav-link">${s('contact')}</a>
                    </div>
                </nav>

                <main class="talent-main">
                    <section class="talent-section" id="overview">
                        <h2 class="section-title">${s('overview')}</h2>
                        <div class="details-grid">
                            <div class="details-card">
                                <h4>${s('personal')}</h4>
                                <div class="details-list">
                                    ${detailRow('age', ageText)}
                                    ${detailRow('gender', genderText)}
                                    ${detailRow('city', city)}
                                    ${detailRow('languages', languages.join(', '))}
                                </div>
                            </div>
                            ${heightText || weightText || L(talent.eyeColor) || L(talent.hairColor) ? `
                            <div class="details-card">
                                <h4>${s('appearance')}</h4>
                                <div class="details-list">
                                    ${detailRow('height', heightText)}
                                    ${detailRow('weight', weightText)}
                                    ${detailRow('eyeColor', L(talent.eyeColor))}
                                    ${detailRow('hairColor', L(talent.hairColor))}
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        ${bio ? `
                        <div class="overview-block">
                            <h3>${s('bio')}</h3>
                            <p class="bio-text">${esc(bio)}</p>
                        </div>
                        ` : ''}

                        ${education ? `
                        <div class="overview-block">
                            <h3>${s('education')}</h3>
                            <p class="bio-text">${esc(education)}</p>
                        </div>
                        ` : ''}
                        
                        ${skills.length ? `
                        <div class="overview-block">
                            <h3>${s('skills')}</h3>
                            <div class="skill-tags">
                                ${skills.map(skill => `<span class="skill-tag">${esc(skill)}</span>`).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </section>

                    ${videos.length ? `
                    <section class="talent-section" id="showreels">
                        <h2 class="section-title">${s('showreels')}</h2>
                        <div class="videos-grid">
                            ${videos.map(url => `
                                <div class="video-card">
                                    <div class="video-embed">${T.videoEmbedHtml(url)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                    ` : ''}

                    ${photos.length > 1 ? `
                    <section class="talent-section" id="photos">
                        <h2 class="section-title">${s('photoGallery')}</h2>
                        <div class="photos-grid">
                            ${photos.map((photo, i) => `
                            <button type="button" class="photo-item" data-lightbox="${i}" aria-label="${s('photos')} ${i + 1}">
                                <img src="${esc(photo)}" alt="${esc(name)} ${i + 1}" loading="lazy">
                            </button>
                            `).join('')}
                        </div>
                    </section>
                    ` : ''}

                    ${hasCv ? `
                    <section class="talent-section" id="cv">
                        <h2 class="section-title">${s('cvTitle')}</h2>
                        ${experience ? `
                        <div class="cv-text">
                            <p>${esc(experience)}</p>
                        </div>
                        ` : ''}
                        ${cvUrl ? `<a href="${esc(cvUrl)}" class="cv-download" target="_blank" rel="noopener">⬇ ${s('downloadCv')}</a>` : ''}
                    </section>
                    ` : ''}

                    <section class="talent-section" id="contact">
                        <h2 class="section-title">${s('contact')}</h2>
                        <div class="contact-section">
                            <div class="contact-grid">
                                ${email ? `
                                <div class="contact-method">
                                    <div class="contact-icon">📧</div>
                                    <div class="contact-info">
                                        <h5>${s('email')}</h5>
                                        <a href="mailto:${esc(email)}">${esc(email)}</a>
                                    </div>
                                </div>
                                ` : ''}
                                ${phone ? `
                                <div class="contact-method">
                                    <div class="contact-icon">📞</div>
                                    <div class="contact-info">
                                        <h5>${s('phone')}</h5>
                                        <a href="tel:${esc(phone.replace(/[^\d+]/g, ''))}">${esc(phone)}</a>
                                    </div>
                                </div>
                                ` : ''}
                                <div class="contact-method">
                                    <div class="contact-icon">🎬</div>
                                    <div class="contact-info">
                                        <h5>${s('agency')}</h5>
                                        <a href="mailto:info@shuqi.ge?subject=${encodeURIComponent(name)}">shuQi Production · info@shuqi.ge</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </main>
            `;

            setupNavigation();
        }

        function showNotFound() {
            document.title = T.str('notFoundTitle', currentLang) + ' - shuQi Production';
            document.getElementById('talentPageContent').innerHTML = `
                <div class="not-found">
                    <h1>${esc(T.str('notFoundTitle', currentLang))}</h1>
                    <p>${esc(T.str('notFoundText', currentLang))}</p>
                    <a href="portfolio.html">${esc(T.str('backToPortfolio', currentLang))}</a>
                </div>
            `;
        }

        function showLoadError() {
            document.getElementById('talentPageContent').innerHTML = `
                <div class="not-found">
                    <p>${esc(T.str('loadError', currentLang))}</p>
                    <a href="portfolio.html">${esc(T.str('backToPortfolio', currentLang))}</a>
                </div>
            `;
        }

        // ========================================
        // PHOTOS & LIGHTBOX
        // ========================================
        document.getElementById('talentPageContent').addEventListener('click', (e) => {
            const thumb = e.target.closest('[data-thumb]');
            if (thumb) {
                const index = Number(thumb.dataset.thumb);
                document.getElementById('heroMainPhoto').src = currentPhotos[index];
                document.querySelectorAll('.talent-thumb').forEach(t => t.classList.remove('active'));
                thumb.querySelector('.talent-thumb').classList.add('active');
                return;
            }
            const item = e.target.closest('[data-lightbox]');
            if (item) openLightbox(Number(item.dataset.lightbox));
        });

        const lightbox = document.getElementById('photoLightbox');
        let lastFocused = null;

        function openLightbox(index) {
            if (!currentPhotos.length) return;
            lastFocused = document.activeElement;
            currentLightboxIndex = index;
            document.getElementById('lightboxImage').src = currentPhotos[index];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('lightboxClose').focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        function navigateLightbox(dir) {
            const n = currentPhotos.length;
            currentLightboxIndex = (currentLightboxIndex + dir + n) % n;
            document.getElementById('lightboxImage').src = currentPhotos[currentLightboxIndex];
        }

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Swipe between photos on phones
        let touchStartX = null;
        lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        lightbox.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) navigateLightbox(dx < 0 ? 1 : -1);
            touchStartX = null;
        });

        // ========================================
        // SECTION NAV SCROLL SPY
        // ========================================
        let scrollSpyBound = false;
        function setupNavigation() {
            if (scrollSpyBound) return;
            scrollSpyBound = true;
            window.addEventListener('scroll', () => {
                let current = '';
                document.querySelectorAll('.talent-section').forEach(section => {
                    if (window.scrollY >= section.offsetTop - 150) current = section.id;
                });
                document.querySelectorAll('.talent-nav-link').forEach(link => {
                    link.classList.toggle('active', link.getAttribute('href') === '#' + current);
                });
            }, { passive: true });
        }

        // ========================================
        // INIT
        // ========================================
        updateLanguage(currentLang);

        const slug = getTalentSlug();
        T.loadTalents()
            .then(talents => {
                currentTalent = slug ? talents.find(t => t.slug === slug) : null;
                if (currentTalent) {
                    renderTalentPage(currentTalent);
                    if (window.location.hash) {
                        const target = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
                        if (target) target.scrollIntoView();
                    }
                } else {
                    notFound = true;
                    showNotFound();
                }
            })
            .catch(err => {
                console.error('Failed to load talents:', err);
                showLoadError();
            });
    </script>
</body>
</html>
