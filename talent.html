<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მსახიობი - shuQi Production</title>
    <meta name="description" content="მსახიობის პორტფოლიო: ფოტოები, შოურილი და CV. Actor profile at shuQi Production.">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="shuQi Production - Actor Portfolio">
    <meta property="og:description" content="Actor Profile - shuQi Production">
    <meta property="og:type" content="profile">
    <meta property="og:image" content="https://www.shuqi.ge/images/web.png">
    <meta property="og:locale" content="ka_GE">

    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/shuqi.css">
    <script>document.documentElement.classList.add('js');</script>
    <script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        #talentPageContent { flex: 1; }

        /* ---------- Profile hero ---------- */
        .profile {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
            gap: clamp(32px, 6vw, 96px);
            padding-block: clamp(32px, 5vw, 72px) var(--section-y);
            align-items: start;
        }
        .profile-photo { position: sticky; top: calc(var(--header-h) + 24px); }
        .profile-main {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: var(--surface-2);
            cursor: zoom-in;
        }
        .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 8px; }
        .thumb-btn { padding: 0; border: 0; background: var(--surface-2); cursor: pointer; aspect-ratio: 1; overflow: hidden; position: relative; }
        .thumb-btn img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: opacity 0.25s var(--ease); }
        .thumb-btn:hover img, .thumb-btn.active img { opacity: 1; }
        .thumb-btn.active::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--ink); }

        .profile-name { font-size: clamp(2.75rem, 1.5rem + 4.6vw, 5.75rem); }
        .profile-role { margin: 20px 0 0; font-size: 1.15rem; color: var(--muted); }

        .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: clamp(28px, 4vw, 48px) 0 0; }
        .facts div { padding: 16px 16px 16px 0; border-top: 1px solid var(--line); }
        .facts dt { font-size: 13px; color: var(--muted); }
        .facts dd { margin: 2px 0 0; font-size: 1.15rem; font-weight: 600; color: var(--ink); }

        .profile-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }

        .block { margin-top: clamp(40px, 5vw, 64px); }
        .block h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 14px; }
        .block p { margin: 0; max-width: 62ch; white-space: pre-line; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { display: inline-flex; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 15px; color: var(--ink); }

        .timeline { list-style: none; margin: 0; padding: 0; }
        .timeline li { padding: 14px 0; border-top: 1px solid var(--line); max-width: 62ch; }
        .timeline li:first-child { border-top: 0; padding-top: 0; }

        /* ---------- Full-width sections ---------- */
        .profile-section { padding-block: var(--section-y); border-top: 1px solid var(--line); }
        .profile-section .section-title { margin-bottom: clamp(28px, 3vw, 44px); }

        .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 20px; max-width: 1100px; }
        .video-embed { aspect-ratio: 16 / 9; background: #0b0b0d; }
        .video-embed iframe, .video-embed video { width: 100%; height: 100%; border: 0; display: block; }

        .photos-grid { columns: 3; column-gap: 16px; }
        .photo-item { display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; background: var(--surface-2); cursor: zoom-in; break-inside: avoid; overflow: hidden; }
        .photo-item img { width: 100%; height: auto; transition: transform 1s var(--ease); }
        .photo-item:hover img { transform: scale(1.03); }

        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px 48px; }
        .contact-item { display: flex; gap: 14px; align-items: flex-start; }
        .contact-item .icon { width: 22px; height: 22px; margin-top: 4px; color: var(--muted); }
        .contact-item h3 { font-size: 13px; font-weight: 500; color: var(--muted); }
        .contact-item a { font-size: 1.15rem; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
        .contact-item a:hover { border-color: var(--ink); }

        /* ---------- States ---------- */
        .state { padding-block: var(--section-y); }
        .state h1 { font-size: clamp(2.25rem, 1.5rem + 3vw, 4rem); }
        .state p { margin: 16px 0 28px; color: var(--muted); }
        .skeleton-block { background: var(--surface-2); }
        @media (prefers-reduced-motion: no-preference) { .skeleton-block { animation: pulse 1.4s ease-in-out infinite; } }
        @keyframes pulse { 50% { opacity: 0.55; } }

        /* ---------- Lightbox ---------- */
        .photo-lightbox { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; background: rgba(8, 8, 10, 0.96); }
        .photo-lightbox.active { display: flex; }
        .lightbox-image { max-width: 92vw; max-height: 86vh; object-fit: contain; }
        .lb-btn {
            position: absolute;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            cursor: pointer;
        }
        .lb-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: #fff; }
        .lightbox-close { top: 20px; right: 20px; }
        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }

        @media (max-width: 899px) {
            .profile { grid-template-columns: 1fr; }
            .profile-photo { position: static; }
        }
        @media (max-width: 767px) {
            .photos-grid { columns: 2; column-gap: 10px; }
            .photo-item { margin-bottom: 10px; }
            .lightbox-prev, .lightbox-next { top: auto; bottom: 20px; transform: none; }
        }
    </style>
</head>
<body>
    <header class="header header--compact">
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="shuQi Production">
                <img src="./images/shuqi-logo.png" alt="shuQi Production" class="header-logo">
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link" data-i18n="home">მთავარი</a>
                <a href="portfolio.html" class="nav-link" data-i18n="portfolio">პორტფოლიო</a>
                <a href="index.html#contact" class="nav-link" data-i18n="contact">კონტაქტი</a>
                <button class="lang-switch" id="langSwitch" type="button">EN</button>
            </nav>
        </div>
    </header>

    <main id="talentPageContent">
        <div class="container profile" aria-busy="true">
            <div class="skeleton-block" style="aspect-ratio: 3 / 4;"></div>
            <div>
                <div class="skeleton-block" style="height: 72px; width: 70%;"></div>
                <div class="skeleton-block" style="height: 18px; width: 30%; margin-top: 18px;"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <a href="index.html" aria-label="shuQi Production"><img src="./images/shuqi-logo.png" alt="shuQi Production" class="header-logo"></a>
            <p>&copy; <span id="footerYear">2026</span> shuQi Production. <span data-i18n="rights">ყველა უფლება დაცულია.</span></p>
            <a href="portfolio.html" class="text-link"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-arrow-left"/></svg><span data-i18n="portfolio">პორტფოლიო</span></a>
        </div>
    </footer>

    <!-- Photo Lightbox -->
    <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true">
        <button class="lb-btn lightbox-close" id="lightboxClose" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-x"/></svg></button>
        <button class="lb-btn lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-caret-left"/></svg></button>
        <img src="" alt="" class="lightbox-image" id="lightboxImage">
        <button class="lb-btn lightbox-next" id="lightboxNext" type="button" aria-label="Next"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-caret-right"/></svg></button>
    </div>

    <script src="talents/talents.js"></script>
    <script src="assets/shuqi.js"></script>
    <script>
        const T = window.ShuqiTalents;
        const esc = T.escapeHtml;
        const icon = name => `<svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-${name}"/></svg>`;
        let currentLang = T.getLang();
        let currentTalent = null;
        let notFound = false;
        let currentPhotos = [];
        let currentLightboxIndex = 0;

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        function getTalentSlug() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) return id;
            const match = window.location.pathname.match(/\/talent\/([^\/]+)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        // ========================================
        // LANGUAGE
        // ========================================
        function updateLanguage(lang) {
            currentLang = lang;
            T.setLang(lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = T.str(el.dataset.i18n, lang);
            });
            const langSwitch = document.getElementById('langSwitch');
            langSwitch.textContent = lang === 'ka' ? 'EN' : 'ქარ';
            langSwitch.title = lang === 'ka' ? 'Switch to English' : 'ქართულზე გადართვა';
            document.getElementById('lightboxClose').setAttribute('aria-label', T.str('close', lang));
            document.getElementById('lightboxPrev').setAttribute('aria-label', T.str('prev', lang));
            document.getElementById('lightboxNext').setAttribute('aria-label', T.str('next', lang));

            if (currentTalent) renderTalentPage(currentTalent);
            else if (notFound) showNotFound();
        }

        document.getElementById('langSwitch').addEventListener('click', () => {
            updateLanguage(currentLang === 'ka' ? 'en' : 'ka');
        });

        // ========================================
        // RENDERING
        // ========================================
        function fact(labelKey, value) {
            if (value === '' || value == null) return '';
            return `<div><dt>${esc(T.str(labelKey, currentLang))}</dt><dd>${esc(value)}</dd></div>`;
        }

        function lines(text) {
            return String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
        }

        function renderTalentPage(talent) {
            const lang = currentLang;
            const s = key => esc(T.str(key, lang));
            const L = value => T.localized(value, lang);

            const name = L(talent.name);
            const photos = T.getPhotos(talent);
            const mainPhoto = photos[0] || T.placeholderPhoto;
            const videos = T.getVideos(talent);
            const skills = T.list(talent.skills, lang);
            const languages = T.list(talent.languages, lang);
            const age = T.getAge(talent);
            const ageText = age != null ? `${age} ${T.str('yearsOld', lang)}` : '';
            const genderText = talent.gender ? T.str(talent.gender === 'male' ? 'male' : 'female', lang) : '';
            const heightText = talent.height ? `${talent.height} ${T.str('cm', lang)}` : '';
            const weightText = talent.weight ? `${talent.weight} ${T.str('kg', lang)}` : '';
            const city = L(talent.city);
            const bio = L(talent.bio);
            const education = lines(L(talent.education));
            const experience = lines(L(talent.experience));
            const cvUrl = T.safeUrl(talent.cv);
            const role = L(talent.role) || T.str('actor', lang);
            const email = talent.email ? String(talent.email).trim() : '';
            const phone = talent.phone ? String(talent.phone).trim() : '';

            document.title = name + ' - shuQi Production';
            currentPhotos = photos;

            document.getElementById('talentPageContent').innerHTML = `
                <div class="container profile">
                    <div class="profile-photo">
                        <img src="${esc(mainPhoto)}" alt="${esc(name)}" class="profile-main" id="heroMainPhoto" data-index="0" onerror="this.onerror=null;this.src='${T.placeholderPhoto}'">
                        ${photos.length > 1 ? `
                        <div class="thumbs">
                            ${photos.map((photo, i) => `
                                <button type="button" class="thumb-btn ${i === 0 ? 'active' : ''}" data-thumb="${i}" aria-label="${s('photos')} ${i + 1}">
                                    <img src="${esc(photo)}" alt="" loading="lazy">
                                </button>
                            `).join('')}
                        </div>` : ''}
                    </div>

                    <div class="profile-info">
                        <h1 class="display profile-name">${esc(name)}</h1>
                        <p class="profile-role">${esc(role)}</p>

                        <dl class="facts">
                            ${fact('age', ageText)}
                            ${fact('height', heightText)}
                            ${fact('weight', weightText)}
                            ${fact('gender', genderText)}
                            ${fact('city', city)}
                            ${fact('eyeColor', L(talent.eyeColor))}
                            ${fact('hairColor', L(talent.hairColor))}
                        </dl>

                        <div class="profile-actions">
                            <a href="#contact" class="btn btn-primary"><span>${s('contactBtn')}</span>${icon('arrow-right')}</a>
                            ${videos.length ? `<a href="#showreels" class="btn btn-secondary">${icon('play')}<span>${s('showreel')}</span></a>` : ''}
                            ${cvUrl ? `<a href="${esc(cvUrl)}" class="btn btn-secondary" target="_blank" rel="noopener">${icon('download-simple')}<span>${s('downloadCv')}</span></a>` : ''}
                        </div>

                        ${bio ? `<div class="block"><h2>${s('bio')}</h2><p>${esc(bio)}</p></div>` : ''}
                        ${experience.length ? `<div class="block" id="cv"><h2>${s('cvTitle')}</h2><ul class="timeline">${experience.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
                        ${education.length ? `<div class="block"><h2>${s('education')}</h2><ul class="timeline">${education.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
                        ${skills.length ? `<div class="block"><h2>${s('skills')}</h2><div class="chips">${skills.map(k => `<span class="chip">${esc(k)}</span>`).join('')}</div></div>` : ''}
                        ${languages.length ? `<div class="block"><h2>${s('languages')}</h2><div class="chips">${languages.map(k => `<span class="chip">${esc(k)}</span>`).join('')}</div></div>` : ''}
                    </div>
                </div>

                ${videos.length ? `
                <section class="profile-section" id="showreels">
                    <div class="container">
                        <h2 class="section-title reveal">${s('showreels')}</h2>
                        <div class="videos-grid">
                            ${videos.map(url => `<div class="video-embed reveal">${T.videoEmbedHtml(url)}</div>`).join('')}
                        </div>
                    </div>
                </section>` : ''}

                ${photos.length > 1 ? `
                <section class="profile-section" id="photos">
                    <div class="container">
                        <h2 class="section-title reveal">${s('photoGallery')}</h2>
                        <div class="photos-grid">
                            ${photos.map((photo, i) => `
                            <button type="button" class="photo-item reveal" style="--i:${i % 3}" data-lightbox="${i}" aria-label="${s('photos')} ${i + 1}">
                                <img src="${esc(photo)}" alt="${esc(name)} ${i + 1}" loading="lazy">
                            </button>`).join('')}
                        </div>
                    </div>
                </section>` : ''}

                <section class="profile-section" id="contact">
                    <div class="container">
                        <h2 class="section-title reveal">${s('contact')}</h2>
                        <div class="contact-grid">
                            ${email ? `<div class="contact-item reveal">${icon('envelope-simple')}<div><h3>${s('email')}</h3><a href="mailto:${esc(email)}">${esc(email)}</a></div></div>` : ''}
                            ${phone ? `<div class="contact-item reveal">${icon('phone')}<div><h3>${s('phone')}</h3><a href="tel:${esc(phone.replace(/[^\d+]/g, ''))}">${esc(phone)}</a></div></div>` : ''}
                            <div class="contact-item reveal">${icon('film-slate')}<div><h3>${s('agency')}</h3><a href="mailto:info@shuqi.ge?subject=${encodeURIComponent(name)}">info@shuqi.ge</a></div></div>
                            <div class="contact-item reveal">${icon('phone')}<div><h3>shuQi Production</h3><a href="tel:+995511175317">+995 511175317</a></div></div>
                        </div>
                    </div>
                </section>
            `;

            window.ShuqiUI && window.ShuqiUI.initReveal();
        }

        function showNotFound() {
            document.title = T.str('notFoundTitle', currentLang) + ' - shuQi Production';
            document.getElementById('talentPageContent').innerHTML = `
                <div class="container state">
                    <h1 class="display">${esc(T.str('notFoundTitle', currentLang))}</h1>
                    <p>${esc(T.str('notFoundText', currentLang))}</p>
                    <a href="portfolio.html" class="btn btn-secondary">${icon('arrow-left')}<span>${esc(T.str('portfolio', currentLang))}</span></a>
                </div>
            `;
        }

        function showLoadError() {
            document.getElementById('talentPageContent').innerHTML = `
                <div class="container state">
                    <p>${esc(T.str('loadError', currentLang))}</p>
                    <a href="portfolio.html" class="btn btn-secondary">${icon('arrow-left')}<span>${esc(T.str('portfolio', currentLang))}</span></a>
                </div>
            `;
        }

        // ========================================
        // PHOTOS & LIGHTBOX
        // ========================================
        document.getElementById('talentPageContent').addEventListener('click', (e) => {
            const thumb = e.target.closest('[data-thumb]');
            if (thumb) {
                const index = Number(thumb.dataset.thumb);
                const main = document.getElementById('heroMainPhoto');
                main.src = currentPhotos[index];
                main.dataset.index = index;
                document.querySelectorAll('.thumb-btn').forEach(t => t.classList.toggle('active', t === thumb));
                return;
            }
            if (e.target.id === 'heroMainPhoto' && currentPhotos.length) {
                openLightbox(Number(e.target.dataset.index) || 0);
                return;
            }
            const item = e.target.closest('[data-lightbox]');
            if (item) openLightbox(Number(item.dataset.lightbox));
        });

        const lightbox = document.getElementById('photoLightbox');
        let lastFocused = null;

        function openLightbox(index) {
            if (!currentPhotos.length) return;
            lastFocused = document.activeElement;
            currentLightboxIndex = index;
            document.getElementById('lightboxImage').src = currentPhotos[index];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('lightboxClose').focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        function navigateLightbox(dir) {
            const n = currentPhotos.length;
            currentLightboxIndex = (currentLightboxIndex + dir + n) % n;
            document.getElementById('lightboxImage').src = currentPhotos[currentLightboxIndex];
        }

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Swipe between photos on phones
        let touchStartX = null;
        lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        lightbox.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) navigateLightbox(dx < 0 ? 1 : -1);
            touchStartX = null;
        });

        // ========================================
        // INIT
        // ========================================
        updateLanguage(currentLang);

        const slug = getTalentSlug();
        T.loadTalents()
            .then(talents => {
                currentTalent = slug ? talents.find(t => t.slug === slug) : null;
                if (currentTalent) {
                    renderTalentPage(currentTalent);
                    if (window.location.hash) {
                        const target = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
                        if (target) target.scrollIntoView();
                    }
                } else {
                    notFound = true;
                    showNotFound();
                }
            })
            .catch(err => {
                console.error('Failed to load talents:', err);
                showLoadError();
            });
    </script>
</body>
</html>
