<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პორტფოლიო - shuQi Production</title>
    <meta name="description" content="shuQi Production-ის მსახიობების პორტფოლიო: ფოტოები, შოურილები და CV. Actor portfolio database of shuQi Production.">
    <link rel="canonical" href="https://www.shuqi.ge/portfolio.html">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="პორტფოლიო - shuQi Production">
    <meta property="og:description" content="მსახიობების მონაცემთა ბაზა - shuQi Production">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.shuqi.ge/portfolio.html">
    <meta property="og:image" content="https://www.shuqi.ge/images/web.png">
    <meta property="og:locale" content="ka_GE">

    <meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/shuqi.css">
    <script>document.documentElement.classList.add('js');</script>
    <script defer src="https://va.vercel-scripts.com/v1/script.js"></script>

    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }

        .page-head { padding-block: clamp(48px, 7vw, 104px) clamp(28px, 3vw, 40px); }
        .page-head .section-title { font-size: clamp(2.75rem, 1.6rem + 4.5vw, 5.5rem); }
        .page-head .lead { margin: 14px 0 0; }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) auto;
            gap: 12px;
            align-items: center;
            padding-block: 20px;
            border-block: 1px solid var(--line);
        }
        .field {
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            font: inherit;
            font-size: 16px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 0;
        }
        .field::placeholder { color: var(--muted); opacity: 1; }
        .field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 70%, transparent); }
        .result-count { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }

        .talent-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 48px 20px;
            padding-block: clamp(32px, 4vw, 56px) var(--section-y);
        }

        .talent-card { display: block; color: inherit; text-decoration: none; }
        .talent-photo-container { aspect-ratio: 3 / 4; overflow: hidden; background: var(--surface-2); }
        .talent-photo { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
        .talent-card:hover .talent-photo { transform: scale(1.04); }
        .talent-name { margin-top: 16px; font-size: 1.15rem; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; }
        .talent-name .icon { opacity: 0; transform: translate(-4px, 2px); transition: opacity 0.3s var(--ease), transform 0.3s var(--ease); }
        .talent-card:hover .talent-name .icon, .talent-card:focus-visible .talent-name .icon { opacity: 1; transform: translate(0, 2px); }
        .talent-meta { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
        .talent-skills { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }

        .state-message {
            grid-column: 1 / -1;
            padding: clamp(40px, 6vw, 72px) 0;
            color: var(--muted);
            font-size: 1.1rem;
        }

        /* Skeleton while the JSON loads: same shape as a card. */
        .skeleton .talent-photo-container,
        .skeleton .sk-line { background: var(--surface-2); }
        .skeleton .sk-line { height: 14px; margin-top: 16px; width: 60%; }
        .skeleton .sk-line + .sk-line { margin-top: 8px; width: 40%; }
        @media (prefers-reduced-motion: no-preference) {
            .skeleton .talent-photo-container, .skeleton .sk-line { animation: pulse 1.4s ease-in-out infinite; }
        }
        @keyframes pulse { 50% { opacity: 0.55; } }

        .join {
            display: grid;
            grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
            gap: 24px 64px;
            align-items: end;
            padding-block: var(--section-y);
            border-top: 1px solid var(--line);
        }
        .join h2 { font-size: clamp(1.9rem, 1.2rem + 2.4vw, 3.25rem); }
        .join p { margin: 16px 0 0; max-width: 54ch; }
        .join .btn { justify-self: start; }

        @media (max-width: 1100px) { .talent-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 767px) {
            .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .toolbar .search { grid-column: 1 / -1; }
            .result-count { grid-column: 1 / -1; text-align: left; }
            .talent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 12px; }
            .talent-name { font-size: 1rem; }
            .talent-skills { display: none; }
            .join { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header header--compact">
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="shuQi Production">
                <img src="./images/shuqi-logo.png" alt="shuQi Production" class="header-logo">
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link" data-i18n="home">მთავარი</a>
                <a href="portfolio.html" class="nav-link" aria-current="page" data-i18n="portfolio">პორტფოლიო</a>
                <a href="index.html#contact" class="nav-link" data-i18n="contact">კონტაქტი</a>
                <button class="lang-switch" id="langSwitch" type="button">EN</button>
            </nav>
        </div>
    </header>

    <main id="talents">
        <section class="container page-head">
            <h1 class="section-title" data-i18n="portfolio">პორტფოლიო</h1>
            <p class="lead" data-i18n="subtitle">მსახიობების მონაცემთა ბაზა</p>
        </section>

        <div class="container">
            <div class="toolbar" role="search">
                <input type="search" class="field search" id="talentSearchName" data-i18n-placeholder="searchPlaceholder" placeholder="სახელით ძებნა..." aria-label="Search">
                <select class="field" id="talentFilterGender" aria-label="Gender">
                    <option value="" data-i18n="allGenders">ყველა სქესი</option>
                    <option value="male" data-i18n="male">მამრობითი</option>
                    <option value="female" data-i18n="female">მდედრობითი</option>
                </select>
                <select class="field" id="talentFilterAge" aria-label="Age">
                    <option value="" data-i18n="allAges">ყველა ასაკი</option>
                    <option value="0-17" data-i18n="under18">18-მდე</option>
                    <option value="18-25">18-25</option>
                    <option value="26-35">26-35</option>
                    <option value="36-45">36-45</option>
                    <option value="46-55">46-55</option>
                    <option value="56-200">56+</option>
                </select>
                <span class="result-count" id="resultCount" aria-live="polite"></span>
            </div>

            <div class="talent-grid" id="talentGrid" aria-busy="true">
                <div class="talent-card skeleton" aria-hidden="true"><div class="talent-photo-container"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="talent-card skeleton" aria-hidden="true"><div class="talent-photo-container"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="talent-card skeleton" aria-hidden="true"><div class="talent-photo-container"></div><div class="sk-line"></div><div class="sk-line"></div></div>
                <div class="talent-card skeleton" aria-hidden="true"><div class="talent-photo-container"></div><div class="sk-line"></div><div class="sk-line"></div></div>
            </div>

            <section class="join">
                <div>
                    <h2 class="section-title reveal" data-i18n="joinTitle">გინდა შენი პორტფოლიოც აქ იყოს?</h2>
                    <p class="reveal" data-i18n="joinText"></p>
                </div>
                <a href="index.html#registration" class="btn btn-primary reveal"><span data-i18n="joinCta">დარეგისტრირდი</span><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-arrow-right"/></svg></a>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <a href="index.html" aria-label="shuQi Production"><img src="./images/shuqi-logo.png" alt="shuQi Production" class="header-logo"></a>
            <p>&copy; <span id="footerYear">2026</span> shuQi Production. <span data-i18n="rights">ყველა უფლება დაცულია.</span></p>
            <div class="footer-social">
                <a href="https://www.facebook.com/profile.php?id=61586814920651" target="_blank" rel="noopener" class="icon-btn" aria-label="Facebook"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-facebook-logo"/></svg></a>
                <a href="https://www.instagram.com/shuqiproduction" target="_blank" rel="noopener" class="icon-btn" aria-label="Instagram"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-instagram-logo"/></svg></a>
                <a href="https://tiktok.com/@shuqischool" target="_blank" rel="noopener" class="icon-btn" aria-label="TikTok"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-tiktok-logo"/></svg></a>
            </div>
        </div>
    </footer>

    <script src="talents/talents.js"></script>
    <script src="assets/shuqi.js"></script>
    <script>
        const T = window.ShuqiTalents;
        let currentLang = T.getLang();
        let talents = null;
        let loadFailed = false;

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // ========================================
        // LANGUAGE SWITCHING
        // ========================================
        function updateLanguage(lang) {
            currentLang = lang;
            T.setLang(lang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = T.str(el.dataset.i18n, lang);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = T.str(el.dataset.i18nPlaceholder, lang);
            });

            const langSwitch = document.getElementById('langSwitch');
            langSwitch.textContent = lang === 'ka' ? 'EN' : 'ქარ';
            langSwitch.title = lang === 'ka' ? 'Switch to English' : 'ქართულზე გადართვა';
            document.title = T.str('portfolio', lang) + ' - shuQi Production';

            if (talents) renderTalentGrid();
        }

        document.getElementById('langSwitch').addEventListener('click', () => {
            updateLanguage(currentLang === 'ka' ? 'en' : 'ka');
        });

        updateLanguage(currentLang);

        // ========================================
        // TALENT GRID
        // ========================================
        function matchesFilters(talent) {
            const search = document.getElementById('talentSearchName').value.trim().toLowerCase();
            const gender = document.getElementById('talentFilterGender').value;
            const ageRange = document.getElementById('talentFilterAge').value;

            if (search) {
                const names = [T.localized(talent.name, 'ka'), T.localized(talent.name, 'en')]
                    .join(' ').toLowerCase();
                if (!names.includes(search)) return false;
            }
            if (gender && talent.gender !== gender) return false;
            if (ageRange) {
                const age = T.getAge(talent);
                const [min, max] = ageRange.split('-').map(Number);
                if (age == null || age < min || age > max) return false;
            }
            return true;
        }

        function cardHtml(talent, index) {
            const esc = T.escapeHtml;
            const lang = currentLang;
            const name = T.localized(talent.name, lang);
            const photos = T.getPhotos(talent);
            const mainPhoto = photos[0] || T.placeholderPhoto;
            const age = T.getAge(talent);
            const meta = [
                age != null ? `${age} ${T.str('yearsOld', lang)}` : '',
                talent.height ? `${talent.height} ${T.str('cm', lang)}` : '',
                T.getVideos(talent).length ? T.str('withReel', lang) : ''
            ].filter(Boolean).join(', ');
            const skills = T.list(talent.skills, lang).slice(0, 3).join(', ');

            return `
                <a class="talent-card reveal" style="--i:${index % 4}" href="talent.html?id=${encodeURIComponent(talent.slug)}">
                    <div class="talent-photo-container">
                        <img src="${esc(mainPhoto)}" alt="${esc(name)}" class="talent-photo" loading="lazy" onerror="this.onerror=null;this.src='${T.placeholderPhoto}'">
                    </div>
                    <h2 class="talent-name">${esc(name)}<svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-arrow-up-right"/></svg></h2>
                    ${meta ? `<p class="talent-meta">${esc(meta)}</p>` : ''}
                    ${skills ? `<p class="talent-skills">${esc(skills)}</p>` : ''}
                </a>
            `;
        }

        function renderTalentGrid() {
            const grid = document.getElementById('talentGrid');
            const resultCount = document.getElementById('resultCount');
            grid.setAttribute('aria-busy', 'false');

            if (loadFailed) {
                grid.innerHTML = `<p class="state-message">${T.escapeHtml(T.str('loadError', currentLang))}</p>`;
                resultCount.textContent = '';
                return;
            }

            const filtered = talents.filter(matchesFilters);
            grid.innerHTML = filtered.length
                ? filtered.map(cardHtml).join('')
                : `<p class="state-message">${T.escapeHtml(T.str(talents.length ? 'noResults' : 'comingSoon', currentLang))}</p>`;
            resultCount.textContent = talents.length ? `${filtered.length} / ${talents.length}` : '';
            window.ShuqiUI && window.ShuqiUI.initReveal();
        }

        document.getElementById('talentSearchName').addEventListener('input', () => talents && renderTalentGrid());
        document.getElementById('talentFilterGender').addEventListener('change', () => talents && renderTalentGrid());
        document.getElementById('talentFilterAge').addEventListener('change', () => talents && renderTalentGrid());

        T.loadTalents()
            .then(data => { talents = data; })
            .catch(err => {
                console.error('Failed to load talents:', err);
                talents = [];
                loadFailed = true;
            })
            .then(renderTalentGrid);
    </script>
</body>
</html>
